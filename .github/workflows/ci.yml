# Vérification continue : la leçon du 27 juillet — un commit poussé avec la
# suite E2E rouge (perte de données au rechargement) serait resté invisible
# sans exécution systématique. Tout ce que la validation locale exécute
# tourne ici, sur chaque poussée et chaque pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `build` enchaîne tsc -b puis vite build : le typecheck est inclus.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-e2e
          path: test-results/
          retention-days: 7
